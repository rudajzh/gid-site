<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>РестоГид</title>
<meta name="description" content="">
<meta name="theme-color" content="#1E1815">
<script>
  // Тема до отрисовки, чтобы экран не мигал светлым.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<link rel="preload" href="fonts/manrope-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-garamond-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=20260930223055">
<script src="env.js?v=20260930223055"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar__left">
      <span class="wordmark" data-text="brand"></span>
      <div class="city">
        <button class="pill city__button" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="city__name"></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <ul class="city__menu" role="listbox" hidden></ul>
      </div>
    </div>
    <div class="topbar__right">
      <span class="env-badge" hidden data-text="env_preview"></span>
      <button class="icon-button theme-toggle" type="button">
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <button class="icon-button compass" type="button" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l3.5 9h-7z" fill="var(--accent)"/><path d="M12 21l-3.5-9h7z" fill="currentColor" opacity="0.45"/></svg>
  </button>

  <main class="map" id="map" aria-label="Карта ресторанов"></main>
  <p class="map-error" hidden data-text="map_error"></p>

  <section class="sheet" hidden aria-live="polite">
    <button class="sheet__close icon-button" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet__head">
      <h2 class="sheet__name"></h2>
      <span class="sheet__check-sum"></span>
    </div>
    <p class="sheet__cuisine"></p>
    <p class="sheet__checked">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
      <span></span>
    </p>
    <p class="sheet__hours"></p>
    <p class="sheet__fictional" hidden data-text="fictional"></p>
    <button class="button sheet__open" type="button" data-text="open_menu"></button>
  </section>

  <section class="place" hidden aria-labelledby="place-name">
    <div class="place__bar">
      <button class="pill place__back" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span data-text="back_to_map"></span>
      </button>
    </div>
    <div class="place__scroll">
      <header class="place__hero">
        <span class="place__mono" aria-hidden="true"></span>
        <h1 class="place__name" id="place-name"></h1>
        <p class="place__cuisine"></p>
      </header>
      <ul class="place__facts">
        <li class="place__fact place__checked">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
          <span></span>
        </li>
        <li class="place__fact">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <span class="place__address"></span>
        </li>
        <li class="place__fact">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span class="place__hours"></span>
        </li>
        <li class="place__fact">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10h18"/></svg>
          <span class="place__avg"></span>
        </li>
      </ul>
      <p class="place__about"></p>
      <p class="place__fictional" hidden data-text="fictional"></p>
      <nav class="place__tabs" aria-label="Разделы меню"></nav>
      <div class="place__menu"></div>
    </div>
    <div class="cartbar" hidden>
      <button class="button cartbar__button" type="button">
        <span data-text="order_bar"></span>
        <span class="cartbar__sum"></span>
      </button>
    </div>
  </section>

  <section class="order" hidden aria-labelledby="order-title">
    <div class="place__bar">
      <button class="pill order__back" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span data-text="back_to_menu"></span>
      </button>
    </div>
    <div class="order__scroll">
      <header class="order__head">
        <h1 class="order__title" id="order-title" data-text="order_title"></h1>
        <p class="order__place"></p>
      </header>
      <div class="order-lines"></div>
      <p class="order__empty" hidden data-text="order_empty"></p>
      <div class="order__total"><span data-text="order_total"></span><span class="order__sum"></span></div>

      <h2 class="order__label" data-text="order_table"></h2>
      <div class="hall" role="group" aria-labelledby="hall-label"></div>
      <p class="hall__status" id="hall-label" aria-live="polite"></p>
      <ul class="hall__legend">
        <li><i class="dot dot--free"></i><span data-text="legend_free"></span></li>
        <li><i class="dot dot--busy"></i><span data-text="legend_busy"></span></li>
        <li><i class="dot dot--mine"></i><span data-text="legend_selected"></span></li>
      </ul>

      <h2 class="order__label" data-text="order_time"></h2>
      <div class="times" role="radiogroup"></div>
    </div>
    <div class="order__send">
      <button class="button send" type="button"></button>
    </div>
  </section>

  <div class="tg" hidden role="dialog" aria-modal="true" aria-labelledby="tg-title">
    <div class="tg__card">
      <h2 class="tg__title" id="tg-title" data-text="tg_title"></h2>
      <p class="tg__text" data-text="tg_text"></p>
      <p class="tg__soon" data-text="tg_soon"></p>
      <a class="button tg__open" target="_blank" rel="noopener" data-text="tg_open"></a>
      <button class="tg__close" type="button" data-text="ok"></button>
    </div>
  </div>
</div>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="vendor/basemaps.js"></script>
<script src="js/app.js?v=20260930223055"></script>
</body>
</html>
